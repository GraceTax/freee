<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税理士CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;background:#F5F5F0;color:#1A1A1A;font-size:14px}
:root{--green:#1D9E75;--green-dk:#0F6E56;--border:#E2E0D8;--bg:#F5F5F0;--bg2:#FFFFFF;--bg3:#F0EFEA;--text:#1A1A1A;--text2:#6B6966;--text3:#9C9A96}

/* LAYOUT */
.app{display:flex;height:100vh;min-height:600px}
.sidebar{width:210px;min-width:210px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* SIDEBAR */
.logo{padding:16px 18px;border-bottom:1px solid var(--border)}
.logo-t{font-size:15px;font-weight:700;color:var(--text)}
.logo-s{font-size:11px;color:var(--text2);margin-top:2px}
.nav-sec{padding:16px 14px 4px;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);margin:1px 6px;transition:all .15s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:#EAF5F1;color:var(--green);font-weight:600}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);background:#fff}
.uinfo{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;background:#E6F1FB;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#185FA5;flex-shrink:0}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;color:var(--text);flex:1}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:24px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg3)}
.btn-p{background:var(--green);border-color:var(--green-dk);color:#fff;font-weight:600}
.btn-p:hover{background:var(--green-dk)}
.btn-sm{padding:4px 10px;font-size:12px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.scard{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 16px}
.scard-l{font-size:12px;color:var(--text2);margin-bottom:6px}
.scard-v{font-size:22px;font-weight:700;color:var(--text)}
.scard-s{font-size:11px;color:var(--text3);margin-top:3px}

/* TABLES */
.sec-t{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px}
.tbl-wrap{background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:11px;color:var(--text2);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;background:var(--bg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
td{font-size:13px;color:var(--text);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF8}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:#EAF5F0;color:#0F6E56}
.ba{background:#FEF3E2;color:#954E0E}
.br{background:#FDECEC;color:#9B2929}
.bb{background:#EBF3FD;color:#1555A0}
.bgr{background:#F0EFEA;color:#5A5856}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* TASK */
.task-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.chk.done{background:var(--green);border-color:var(--green-dk)}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;background:#fff;border:1px solid var(--border);padding:3px;border-radius:8px;width:fit-content}
.tab{padding:5px 16px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text2);transition:all .15s}
.tab.active{background:var(--green);color:#fff;font-weight:600}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:#F5F5F0;display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:36px 32px;width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.hint-box{background:var(--bg3);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--text2);margin-bottom:18px;line-height:1.7;border:1px solid var(--border)}

/* MODAL */
#modal-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:9000;
  background:rgba(10,10,10,0.65);
  align-items:center;
  justify-content:center;
  padding:16px;
}
#modal-screen.open{display:flex}
.modal-card{
  background:#ffffff;
  border-radius:12px;
  border:1px solid #C8C6BE;
  width:100%;
  max-width:520px;
  max-height:calc(100vh - 80px);
  display:flex;
  flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.12);
  overflow:hidden;
}
.modal-hd{
  padding:18px 22px;
  border-bottom:1px solid #E2E0D8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#F7F6F2;
  flex-shrink:0;
}
.modal-hd h2{font-size:15px;font-weight:700;color:#1A1A1A}
.modal-body{
  padding:22px 24px;
  overflow-y:auto;
  background:#ffffff;
  flex:1;
}
.modal-ft{
  padding:16px 22px;
  border-top:1px solid #E2E0D8;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  background:#F7F6F2;
  flex-shrink:0;
}

/* FORM */
.f-row{margin-bottom:16px}
.f-label{font-size:13px;color:#1A1A1A;margin-bottom:6px;display:block;font-weight:600}
.req{color:#C0392B;margin-left:2px}
.f-input,.f-select,.f-textarea{
  width:100%;
  padding:9px 12px;
  border-radius:7px;
  border:1.5px solid #C8C6BE;
  background:#ffffff;
  color:#1A1A1A;
  font-size:13px;
  font-family:inherit;
  line-height:1.5;
}
.f-input:focus,.f-select:focus,.f-textarea:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.15)}
.f-textarea{resize:vertical;min-height:80px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-sec{font-size:11px;font-weight:700;color:#9C9A96;letter-spacing:.08em;padding:14px 0 10px;border-bottom:1px solid #E2E0D8;margin-bottom:14px}
.f-err{font-size:12px;color:#C0392B;margin-top:5px;display:none}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#F7F6F2;border-radius:8px;padding:14px;border:1px solid #E2E0D8;margin-bottom:16px}
.info-cell{display:flex;flex-direction:column;gap:4px}
.info-lbl{font-size:11px;color:#6B6966}
.info-val{font-size:13px;color:#1A1A1A;font-weight:500}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:22px;font-weight:700;color:#1A1A1A">税理士CRM</div>
      <div style="font-size:12px;color:#6B6966;margin-top:4px">顧客管理システム</div>
    </div>
    <div id="lerr" style="display:none;background:#FDECEC;color:#9B2929;border-radius:7px;padding:9px 14px;font-size:12px;margin-bottom:14px;border:1px solid #F5C6C6">
      IDまたはパスワードが正しくありません
    </div>
    <div class="f-row">
      <label class="f-label">スタッフID</label>
      <input class="f-input" id="lid" type="text" placeholder="スタッフIDを入力">
    </div>
    <div class="f-row">
      <label class="f-label">パスワード</label>
      <input class="f-input" id="lpw" type="password" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="hint-box">
      デモ用アカウント<br>
      管理者：admin / 1234<br>
      担当者：tanaka / 5678
    </div>
    <button class="btn btn-p" style="width:100%;justify-content:center;padding:11px;font-size:14px" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-t">税理士CRM</div>
      <div class="logo-s">顧客管理システム</div>
    </div>
    <div style="padding:8px 0;flex:1">
      <div class="nav-sec">メニュー</div>
      <div class="nav-item active" onclick="nav('dashboard',this)">📊 ダッシュボード</div>
      <div class="nav-item" onclick="nav('clients',this)">👥 顧客一覧</div>
      <div class="nav-item" onclick="nav('cases',this)">📁 案件管理</div>
      <div class="nav-item" onclick="nav('billing',this)">🧾 請求管理</div>
      <div class="nav-item" onclick="nav('tasks',this)">✅ タスク</div>
      <div class="nav-sec">設定</div>
      <div class="nav-item" onclick="nav('staff',this)">⚙️ スタッフ管理</div>
      <div class="nav-item" onclick="nav('freee',this)">🔗 freee連携</div>
    </div>
    <div class="sidebar-foot">
      <div class="uinfo">
        <div class="av" id="uav">管</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;color:#1A1A1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="uname">管理者</div>
          <div style="font-size:10px;color:#9C9A96" id="urole">管理者</div>
        </div>
        <span onclick="doLogout()" style="cursor:pointer;font-size:18px;color:#9C9A96;flex-shrink:0" title="ログアウト">↩</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">ダッシュボード</h1>
      <div id="topbar-btn"></div>
    </div>
    <div class="content" id="page-content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-screen" onclick="overlayClick(event)">
  <div class="modal-card" id="modal-card" onclick="event.stopPropagation()">
    <div class="modal-hd">
      <h2 id="modal-title">フォーム</h2>
      <button class="btn btn-sm" onclick="closeModal()" style="background:#fff;border-color:#C8C6BE;font-size:16px;padding:4px 10px">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ft" id="modal-ft"></div>
  </div>
</div>

<script>
// ===== USERS =====
const USERS = [

  {id:'tanaka', pw:'5678', name:'田中 花子', role:'担当者', av:'田'}

let CU = null;

// ===== DB =====
const DB = {
  clients: [

    {id:3,type:'法人',name:'合同会社テクノサービス',kana:'テクノサービス',contact:'中村 健',tel:'06-3333-4444',gmail:'nakamura@gmail.com',address:'大阪府堺市',status:'見込み',staff:'管理者',memo:'',roumuContract:'無',consultationDate:'2025-03-10',contractOfferDate:'',contactMethod:'紹介',clientCode:'C-0003',contractStartDate:'',gdriveLink:'',mfreee:'',repName:'中村 健',repTitle:'代表社員',repHomeAddress:'',repPostalCode:'',monthlyFee:0,withholding:'なし'},
    {id:4,type:'個人',name:'佐藤 美咲',kana:'サトウ ミサキ',contact:'佐藤 美咲',tel:'080-5555-6666',gmail:'sato@gmail.com',address:'兵庫県神戸市',status:'休眠',staff:'田中 花子',memo:'昨年から連絡なし',roumuContract:'無',consultationDate:'2023-06-01',contractOfferDate:'2023-06-10',contactMethod:'メール',clientCode:'C-0004',contractStartDate:'2023-07-01',gdriveLink:'',mfreee:'',repName:'佐藤 美咲',repTitle:'',repHomeAddress:'兵庫県神戸市〇〇3-4-5',repPostalCode:'650-0000',monthlyFee:20000,withholding:'あり'},
  ],
  cases: [
    {id:1,clientId:1,title:'令和6年度 法人税申告',type:'法人税',status:'進行中',startDate:'2025-04-01',dueDate:'2025-05-31',staff:'田中 花子',fee:120000},
    {id:2,clientId:2,title:'令和6年分 確定申告',type:'確定申告',status:'完了',startDate:'2025-01-15',dueDate:'2025-03-15',staff:'管理者',fee:55000},
    {id:3,clientId:1,title:'記帳代行（4月分）',type:'記帳代行',status:'進行中',startDate:'2025-04-01',dueDate:'2025-04-25',staff:'田中 花子',fee:30000},

  ],

    {id:1,clientId:1,caseId:1,title:'法人税申告報酬',amount:120000,issueDate:'2025-05-31',dueDate:'2025-06-30',status:'未収',memo:''},
    {id:2,clientId:2,caseId:2,title:'確定申告報酬',amount:55000,issueDate:'2025-03-15',dueDate:'2025-04-15',status:'入金済',memo:'3/20入金'},
    {id:3,clientId:1,caseId:3,title:'記帳代行（4月）',amount:30000,issueDate:'2025-04-30',dueDate:'2025-05-31',status:'未収',memo:''},
    {id:4,clientId:3,caseId:4,title:'見積書発行',amount:0,issueDate:'2025-05-10',dueDate:'-',status:'見積',memo:''},
  ],
  tasks: [
    {id:1,title:'山田商事 決算書類の確認',clientId:1,dueDate:'2025-05-20',staff:'田中 花子',status:'未完了',priority:'高'},
    {id:2,title:'鈴木一郎 還付申告書送付',clientId:2,dueDate:'2025-04-20',staff:'管理者',status:'完了',priority:'中'},
    {id:3,title:'テクノサービス 初回面談準備',clientId:3,dueDate:'2025-05-25',staff:'管理者',status:'未完了',priority:'中'},
    {id:4,title:'税務署提出書類チェック',clientId:1,dueDate:'2025-05-28',staff:'田中 花子',status:'未完了',priority:'高'},
  ],
  nid:{c:5,cs:5,b:5,t:5}

function save(){try{localStorage.setItem('taxcrm_v4',JSON.stringify(DB))}catch(e){}}
function load(){try{const d=localStorage.getItem('taxcrm_v4');if(d)Object.assign(DB,JSON.parse(d))}catch(e){}}
load();

// ===== AUTH =====
function doLogin(){
  const id=document.getElementById('lid').value.trim();
  const pw=document.getElementById('lpw').value;
  const u=USERS.find(u=>u.id===id&&u.pw===pw);
  if(!u){document.getElementById('lerr').style.display='block';return}
  CU=u;
  document.getElementById('lerr').style.display='none';
  document.getElementById('uav').textContent=u.av;
  document.getElementById('uname').textContent=u.name;
  document.getElementById('urole').textContent=u.role;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  nav('dashboard',document.querySelector('.nav-item'));
}
function doLogout(){
  CU=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('lid').value='';
  document.getElementById('lpw').value='';
}

// ===== NAVIGATION =====
function nav(page,el){
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  if(el)el.classList.add('active');
  const titles={dashboard:'ダッシュボード',clients:'顧客一覧',cases:'案件管理',billing:'請求管理',tasks:'タスク',staff:'スタッフ管理',freee:'freee連携設定'};
  document.getElementById('page-title').textContent=titles[page];
  closeModal();
  const btn=document.getElementById('topbar-btn');
  const ct=document.getElementById('page-content');
  if(page==='dashboard')pgDash(ct,btn);
  else if(page==='clients')pgClients(ct,btn);
  else if(page==='cases')pgCases(ct,btn);
  else if(page==='billing')pgBilling(ct,btn);
  else if(page==='tasks')pgTasks(ct,btn);
  else if(page==='staff')pgStaff(ct,btn);
  else if(page==='freee')pgFreee(ct,btn);
}

// ===== MODAL =====
function openModal(title,body,footer){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-ft').innerHTML=footer;
  document.getElementById('modal-screen').classList.add('open');
}
function closeModal(){document.getElementById('modal-screen').classList.remove('open')}
function overlayClick(e){if(e.target===document.getElementById('modal-screen'))closeModal()}

// ===== HELPERS =====
function cn(id){const c=DB.clients.find(c=>c.id===id);return c?c.name:'-'}
function badge(s){
  const m={契約中:'bg',進行中:'bb',完了:'bgr',入金済:'bg',未収:'ba',見積:'bgr',見込み:'bb',休眠:'br',見積中:'ba',未完了:'ba',高:'br',中:'ba',低:'bgr',法人:'bb',個人:'bgr',管理者:'bg',担当者:'bgr'};
  return`<span class="badge ${m[s]||'bgr'}">${s}</span>`
}
function sel(arr,id,val=''){return`<select class="f-select" id="${id}">${arr.map(v=>`<option${v===val?' selected':''}>${v}</option>`).join('')}</select>`}
function inp(id,ph,val='',type='text'){return`<input class="f-input" id="${id}" type="${type}" placeholder="${ph}" value="${val}">`}
function staffSel(id){return sel(USERS.map(u=>u.name),id,CU?CU.name:'')}
function saveBtns(fn){return`<button class="btn" onclick="closeModal()">キャンセル</button><button class="btn btn-p" onclick="${fn}()">💾 保存</button>`}

// ===== DASHBOARD =====
function pgDash(c,btn){
  btn.innerHTML='';
  const unc=DB.billing.filter(b=>b.status==='未収').reduce((s,b)=>s+b.amount,0);
  const pt=DB.tasks.filter(t=>t.status==='未完了').length;
  const ac=DB.cases.filter(c=>c.status==='進行中').length;
  c.innerHTML=`
  <div class="stats">
    <div class="scard"><div class="scard-l">顧客数</div><div class="scard-v">${DB.clients.length}</div><div class="scard-s">契約中 ${DB.clients.filter(c=>c.status==='契約中').length}件</div></div>
    <div class="scard"><div class="scard-l">進行中案件</div><div class="scard-v">${ac}</div><div class="scard-s">合計 ${DB.cases.length}件</div></div>
    <div class="scard"><div class="scard-l">未収金額</div><div class="scard-v">¥${unc.toLocaleString()}</div><div class="scard-s">未収 ${DB.billing.filter(b=>b.status==='未収').length}件</div></div>
    <div class="scard"><div class="scard-l">未完了タスク</div><div class="scard-v">${pt}</div><div class="scard-s">高優先度 ${DB.tasks.filter(t=>t.status==='未完了'&&t.priority==='高').length}件</div></div>
  </div>
  <div class="two-col">
    <div>

function openAddClient(){
  openModal('顧客を追加', clientFormBody(null),

}
function saveClient(){
  const f=collectClientFields();
  if(!f.name){document.getElementById('fn-err').style.display='block';document.getElementById('fn').focus();return}
  DB.clients.push({id:DB.nid.c++, ...f});
  save();closeModal();renderCT();
}

function openEditClient(id){
  const cl=DB.clients.find(c=>c.id===id);if(!cl)return;
  openModal('顧客を編集：'+cl.name, clientFormBody(cl),
    `<button class="btn" onclick="closeModal()">キャンセル</button><button class="btn btn-p" onclick="updateClient(${id})">💾 更新</button>`);
}
function updateClient(id){
  const f=collectClientFields();
  if(!f.name){document.getElementById('fn-err').style.display='block';document.getElementById('fn').focus();return}
  const idx=DB.clients.findIndex(c=>c.id===id);
  if(idx===-1)return;
  DB.clients[idx]={...DB.clients[idx], ...f};
  save();closeModal();renderCT();
}

function billingAutoFill(){
  const clientId = parseInt(document.getElementById('bcl')?.value);
  if(!clientId) return;
  const cl = DB.clients.find(c => c.id === clientId);
  if(!cl) return;

  // 月額顧問料（税抜）→ 税込（×1.1、1円未満切り捨て）をセット
  const amtEl = document.getElementById('bamt');
  if(amtEl && cl.monthlyFee) amtEl.value = Math.floor(Number(cl.monthlyFee) * 1.1);

  // 源泉徴収をセット
  const wEl = document.getElementById('bwithholding');
  if(wEl && cl.withholding) wEl.value = cl.withholding;

  // 源泉徴収ありの場合、控除額を計算して表示
  updateWithholdingInfo();

  // 件名が空なら自動セット
  const btEl = document.getElementById('bt');
  if(btEl && !btEl.value) {
    const today = new Date();
    const m = today.getMonth()+1;
    btEl.value = `税務顧問料（${m}月分）`;
  }
}

function updateWithholdingInfo(){
  const wEl = document.getElementById('bwithholding');
  const amtEl = document.getElementById('bamt');
  const infoEl = document.getElementById('bwithholding-info');
  if(!wEl || !amtEl || !infoEl) return;
  if(wEl.value === 'あり'){
    const feeIncTax = parseInt(amtEl.value)||0;
    // 源泉徴収は税抜金額に対して10.21%
    const feeExTax = Math.round(feeIncTax / 1.1);
    const tax = Math.floor(feeExTax * 0.1021);
    const net = feeIncTax - tax;
    infoEl.style.display = 'block';
    infoEl.innerHTML = `源泉徴収あり：請求額（税込）¥${feeIncTax.toLocaleString()} － 源泉税 ¥${tax.toLocaleString()}（税抜 ¥${feeExTax.toLocaleString()} × 10.21%）＝ <strong>入金予定 ¥${net.toLocaleString()}</strong>`;
  } else {
    infoEl.style.display = 'none';
  }
}

function getFreeeSettings(){
  try{return JSON.parse(localStorage.getItem('freee_settings_gas')||'{}')}catch(e){return{}}
}
function saveFreeeSettings(s){localStorage.setItem('freee_settings_gas',JSON.stringify(s))}

// GASエンドポイントへのリクエスト共通関数
async function gasRequest(action, params={}, method='GET', body=null){
  const s = getFreeeSettings();
  if(!s.gasUrl) throw new Error('GASのURLが設定されていません');
  const url = new URL(s.gasUrl);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const opt = { method };
  if(body) opt.body = JSON.stringify(body);
  const res = await fetch(url.toString(), opt);
  return res.json();
}

function saveGasConfig(){

  const msg = document.getElementById('freee-save-msg');
  msg.innerHTML='<span style="color:#1D9E75">✅ 保存しました</span>';
  setTimeout(()=>{msg.innerHTML=''},3000);
}

async function startFreeeAuth(){
  const statusEl = document.getElementById('freee-auth-status');
  statusEl.innerHTML='<span style="color:#6B6966">認証URLを取得中...</span>';
  try{
    const data = await gasRequest('auth_url');
    if(data.auth_url){
      statusEl.innerHTML='<span style="color:#1555A0">🔗 freee認証画面を新しいタブで開きます。ログインして「許可する」を押してください。</span>';
      window.open(data.auth_url,'_blank','width=600,height=700');
    } else {
      statusEl.innerHTML=`<span style="color:#C0392B">❌ エラー：${data.error||'URL取得失敗'}</span>`;
    }
  } catch(e){
    statusEl.innerHTML=`<span style="color:#C0392B">❌ ${e.message}</span>`;
  }
}

async function checkFreeeAuthStatus(){
  const statusEl = document.getElementById('freee-auth-status');
  statusEl.innerHTML='<span style="color:#6B6966">確認中...</span>';
  try{
    const data = await gasRequest('status');
    if(data.authorized){
      statusEl.innerHTML='<span style="color:#1D9E75">✅ freeeと認証済みです。請求書の送信が可能です。</span>';
    } else {
      statusEl.innerHTML='<span style="color:#954E0E">⚠️ 未認証です。「freeeで認証する」ボタンを押してください。</span>';
    }
  } catch(e){
    statusEl.innerHTML=`<span style="color:#C0392B">❌ ${e.message}</span>`;
  }
}

async function revokeFreeeAuth(){
  if(!confirm('freeeの認証を解除しますか？'))return;
  try{
    await gasRequest('logout');
    document.getElementById('freee-auth-status').innerHTML='<span style="color:#6B6966">ログアウトしました</span>';
  } catch(e){
    alert(e.message);
  }
}

    💡 下の「一括コピー」ボタンでデータをコピーして、freeeの請求書画面に貼り付けてください
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
    ${[
      ['取引先名',    cl.name],
      ['件名',        b.title],
      ['請求日',      b.issueDate||''],
      ['支払期限',    b.dueDate&&b.dueDate!=='-'?b.dueDate:''],
      ['品目名',      b.title],
      ['税抜金額',    taxExcluded.toLocaleString()+'円'],
      ['消費税（10%）', taxAmount.toLocaleString()+'円'],
      ['税込合計',    b.amount.toLocaleString()+'円'],
      ['源泉徴収',    b.withholding==='あり'?withholdingTax.toLocaleString()+'円（税抜×10.21%）':'なし'],
      ['入金予定額',  netAmount.toLocaleString()+'円'],
      ['備考',        b.memo||''],
    ].map(([label,val])=>`
    <div style="display:flex;align-items:center;gap:8px">
      <div style="font-size:11px;color:#6B6966;min-width:100px;flex-shrink:0">${label}</div>
      <div style="flex:1;background:#F7F6F2;border:1px solid #E2E0D8;border-radius:6px;padding:7px 10px;font-size:13px;font-weight:500;word-break:break-all">${val||''}</div>
      <button onclick="copyText(this.dataset.val)" data-val="${val}"
        style="flex-shrink:0;padding:4px 8px;font-size:11px;border:1px solid #C8C6BE;border-radius:5px;background:#fff;cursor:pointer;color:#6B6966"
        title="コピー">📋</button>
    </div>`).join('')}
  </div>

  <div id="copy-toast" style="display:none;background:#EAF5F0;border:1px solid #B2DFD0;border-radius:7px;padding:10px 14px;font-size:13px;color:#0F6E56;margin-bottom:12px;text-align:center">
    ✅ クリップボードにコピーしました！
  </div>`,

  `<button class="btn" onclick="closeModal()">閉じる</button>
   <button class="btn btn-p" style="background:#3d5afe;border-color:#2a3eb1" onclick="copyAllForFreee(${billingId})">📋 一括コピー（テキスト形式）</button>`);
}

function copyText(text){
  navigator.clipboard.writeText(text).then(()=>{
    showCopyToast();
  }).catch(()=>{
    // フォールバック
    const el=document.createElement('textarea');
    el.value=text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showCopyToast();
  });
}

function showCopyToast(){
  const t=document.getElementById('copy-toast');
  if(!t)return;
  t.style.display='block';
  setTimeout(()=>{t.style.display='none'},2000);
}

function copyAllForFreee(billingId){
  const b=DB.billing.find(x=>x.id===billingId);
  const cl=b?DB.clients.find(c=>c.id===b.clientId):null;
  if(!b||!cl)return;

  const taxExcluded=Math.round(b.amount/1.1);
  const taxAmount=b.amount-taxExcluded;
  const withholdingTax=b.withholding==='あり'?Math.floor(taxExcluded*0.1021):0;
  const netAmount=b.amount-withholdingTax;

  const text=[
    '■ freee請求書入力データ',
    '─────────────────',
    `取引先名　：${cl.name}`,
    `件名　　　：${b.title}`,
    `請求日　　：${b.issueDate||''}`,
    `支払期限　：${b.dueDate&&b.dueDate!=='-'?b.dueDate:''}`,
    '─────────────────',
    `品目名　　：${b.title}`,
    `税抜金額　：${taxExcluded.toLocaleString()}円`,
    `消費税10%：${taxAmount.toLocaleString()}円`,
    `税込合計　：${b.amount.toLocaleString()}円`,
    '─────────────────',
    `源泉徴収　：${b.withholding==='あり'?withholdingTax.toLocaleString()+'円（税抜×10.21%）':'なし'}`,
    `入金予定額：${netAmount.toLocaleString()}円`,
    b.memo?`備考　　　：${b.memo}`:'',
  ].filter(Boolean).join('\n');

  navigator.clipboard.writeText(text).then(()=>{
    showCopyToast();
  }).catch(()=>{
    const el=document.createElement('textarea');
    el.value=text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showCopyToast();
  });
}


function sendToFreee(billingId){
  const s=getFreeeSettings();
  if(!s.gasUrl||!s.companyId){
    alert('freee連携の設定が完了していません。\nサイドバーの「freee連携」から設定してください。');
    return;
  }
  const b=DB.billing.find(x=>x.id===billingId);
  const cl=b?DB.clients.find(c=>c.id===b.clientId):null;
  if(!b||!cl){alert('データが見つかりません');return}

  const taxExcluded=Math.round(b.amount/1.1);
  const taxAmount=b.amount-taxExcluded;
  const withholdingTax=b.withholding==='あり'?Math.floor(taxExcluded*0.1021):0;

  openModal('freeeに請求書を送信',`
  <div style="background:#F7F6F2;border-radius:8px;padding:14px 16px;margin-bottom:16px">
    <div style="font-weight:700;margin-bottom:10px;font-size:14px">${b.title}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
      <div><div style="font-size:11px;color:#6B6966">顧客</div><div style="font-weight:600">${cl.name}</div></div>
      <div><div style="font-size:11px;color:#6B6966">請求日</div><div style="font-weight:600">${b.issueDate||'-'}</div></div>
      <div><div style="font-size:11px;color:#6B6966">税抜金額</div><div style="font-weight:600">¥${taxExcluded.toLocaleString()}</div></div>
      <div><div style="font-size:11px;color:#6B6966">消費税（10%）</div><div style="font-weight:600">¥${taxAmount.toLocaleString()}</div></div>
      <div><div style="font-size:11px;color:#6B6966">税込合計</div><div style="font-weight:700;font-size:16px;color:#1D9E75">¥${b.amount.toLocaleString()}</div></div>
      <div><div style="font-size:11px;color:#6B6966">源泉徴収</div><div style="font-weight:600">${b.withholding==='あり'?`あり　控除 ¥${withholdingTax.toLocaleString()}`:'なし'}</div></div>
    </div>
  </div>
  <div class="f-row">
    <label class="f-label">freeeの取引先名</label>
    <input class="f-input" id="freee-partner-name" value="${cl.name}" placeholder="freee上の取引先名">
    <div style="font-size:11px;color:#9C9A96;margin-top:4px">freee上に登録されている取引先名に合わせてください</div>
  </div>
  <div class="f-row">
    <label class="f-label">備考</label>
    <textarea class="f-textarea" id="freee-note" style="min-height:56px" placeholder="請求書備考（任意）">${b.memo||''}</textarea>
  </div>
  <div id="freee-send-result"></div>`,
  `<button class="btn" onclick="closeModal()">キャンセル</button>
   <button class="btn btn-p" style="background:#3d5afe;border-color:#2a3eb1" onclick="execSendToFreee(${billingId})">📤 freeeに送信</button>`);
}

async function execSendToFreee(billingId){
  const s=getFreeeSettings();
  const b=DB.billing.find(x=>x.id===billingId);
  const cl=b?DB.clients.find(c=>c.id===b.clientId):null;
  if(!b||!cl)return;

  const resultEl=document.getElementById('freee-send-result');
  if(!resultEl)return;
  resultEl.innerHTML='<div style="color:#6B6966;font-size:13px;margin-top:10px">⏳ freeeに送信中...</div>';

  const partnerName=document.getElementById('freee-partner-name')?.value.trim()||cl.name;
  const note=document.getElementById('freee-note')?.value.trim()||'';
  const taxExcluded=Math.round(b.amount/1.1);

  const payload={
    company_id: parseInt(s.companyId),
    issue_date: b.issueDate||new Date().toISOString().split('T')[0],
    due_date: (b.dueDate&&b.dueDate!=='-')?b.dueDate:undefined,
    partner_name: partnerName,
    title: b.title,
    description: note,
    invoice_lines:[{
      name: b.title,
      quantity: 1,
      unit_price: taxExcluded,
      tax_code: parseInt(s.taxCode||'101'),
      account_item_name: '売上高'
    }]
  };

  try{
    const data = await gasRequest('create_invoice', {}, 'POST', payload);
    if(data.invoice){
      resultEl.innerHTML=`
      <div style="background:#EAF5F0;border:1px solid #B2DFD0;border-radius:8px;padding:14px;font-size:13px;margin-top:10px;color:#0F6E56">
        ✅ freeeに請求書を作成しました！<br>
        <span style="font-size:12px">請求書番号：${data.invoice.invoice_number||'-'}</span>
      </div>`;
    } else if(data.error){
      resultEl.innerHTML=`<div style="background:#FDECEC;border:1px solid #F5C6C6;border-radius:8px;padding:12px;font-size:13px;margin-top:10px;color:#9B2929">
        ❌ ${data.error}<br><span style="font-size:11px">freee連携設定またはfreeeの認証状態をご確認ください</span></div>`;
    }
  } catch(e){
    resultEl.innerHTML=`<div style="background:#FDECEC;border:1px solid #F5C6C6;border-radius:8px;padding:12px;font-size:13px;margin-top:10px;color:#9B2929">❌ ${e.message}</div>`;
  }
}

</script>
